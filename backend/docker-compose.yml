version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: sharemeal_user
      DB_PASSWORD: sharemeal_password
      DB_NAME: sharemeal_test
      JWT_SECRET: dev_jwt_secret_key_change_in_production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sharemeal_test
      POSTGRES_USER: sharemeal_user
      POSTGRES_PASSWORD: sharemeal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharemeal_user -d sharemeal_test"]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: unless-stopped

volumes:
  postgres_data:
